name: Render approved OPPO-style PWA icons

on:
  push:
    branches: [main]
    paths:
      - 'docs/icon-notes.svg'
      - 'docs/chinese/icon.svg'
      - '.github/workflows/render-app-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-app-icons
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cairosvg==2.8.2'
      - name: Render 192 and 512 PNG icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for svg_file, prefix in [
              ('docs/icon-notes.svg', 'docs/icon-notes'),
              ('docs/chinese/icon.svg', 'docs/chinese/icon'),
          ]:
              data = Path(svg_file).read_bytes()
              for size in (192, 512):
                  cairosvg.svg2png(bytestring=data, write_to=f'{prefix}-{size}.png',
                                 output_width=size, output_height=size)
          PY
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/icon-notes-192.png docs/icon-notes-512.png docs/chinese/icon-192.png docs/chinese/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: regenerate approved ColorOS PWA icons'
            git push origin HEAD:main
          fi
